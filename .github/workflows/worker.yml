# Deploys the usage-events Worker (worker/, see docs/tracking.md) to Cloudflare.
# Finds the D1 database "wordopedia-events" or creates it in the EU jurisdiction, applies migrations, deploys,
# and checks /health. Needs the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
name: Deploy events worker
on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/worker.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: worker
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DB_NAME: wordopedia-events
      PLACEHOLDER: 00000000-0000-0000-0000-000000000000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check secrets
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::Secret CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::Secret CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }
      - run: npm ci --no-audit --no-fund
      - name: Find or create the database (EU jurisdiction)
        run: |
          find_id() { npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const l=JSON.parse(s);const d=l.find(x=>x.name===process.env.DB_NAME);process.stdout.write(d?d.uuid:"")})'; }
          id=$(find_id)
          if [ -z "$id" ]; then
            echo "Creating $DB_NAME in the EU jurisdiction"
            npx wrangler d1 create "$DB_NAME" --jurisdiction eu
            git checkout -- wrangler.toml
            id=$(find_id)
          fi
          [ -n "$id" ] || { echo "::error::Database $DB_NAME not found and could not be created"; exit 1; }
          echo "Database id: $id"
          npx wrangler d1 info "$DB_NAME" || true
          sed -i "s/$PLACEHOLDER/$id/" wrangler.toml
      - name: Apply migrations
        run: npx wrangler d1 migrations apply "$DB_NAME" --remote
      - name: Deploy
        run: |
          npx wrangler deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "WORKER_URL=$url" >> "$GITHUB_ENV"
          echo "Worker URL: $url"
      - name: Health check
        run: |
          [ -n "$WORKER_URL" ] || { echo "::warning::No workers.dev URL in the deploy output"; exit 0; }
          for i in 1 2 3 4 5 6; do curl -fsS "$WORKER_URL/health" && exit 0; sleep 10; done
          echo "::error::$WORKER_URL/health did not answer"; exit 1
