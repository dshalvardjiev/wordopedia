# After a dictionary changes, creates recordings for words that have none and commits them.
name: Recordings for new words
on:
  push:
    branches: [main]
    paths: ['dictionary/*/words.csv', 'dictionary/languages.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: audio
  cancel-in-progress: false
jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install piper-tts==1.8.0
      # Voices come from dictionary/languages.json and are downloaded only for languages with new words.
      - run: python scripts/make_audio.py dictionary voice
      - name: Commit new recordings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git add dictionary/*/audio
          git diff --cached --quiet || (git commit -m "Recordings for new words" && git pull --rebase && git push)
