<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wordopedia usage</title>
<style>
  /* Palette and chart specs: the dataviz reference palette (categorical slots 1-3 validated all-pairs, light and dark). */
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --axis: #c3c2b7; --ring: rgba(11,11,11,0.10); --wash: rgba(11,11,11,0.04);
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --critical: #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10); --wash: rgba(255,255,255,0.05);
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --critical: #e66767;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1180px; margin: 0 auto; padding: 28px 24px 64px; transition: opacity .15s; }
  main.loading { opacity: .5; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  h1 { font-size: 22px; font-weight: 650; margin: 0; }
  .fresh { color: var(--ink-2); font-size: 13px; }
  button, select { font: inherit; color: var(--ink); }
  .btn { background: var(--surface); border: 1px solid var(--ring); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  .btn:hover { background: var(--wash); }
  :focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; }

  .filters { display: flex; flex-wrap: wrap; align-items: end; gap: 18px; margin: 22px 0 20px; }
  .filters label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--ink-2); }
  .filters select { background: var(--surface); border: 1px solid var(--ring); border-radius: 8px; padding: 6px 10px; min-width: 150px; }
  .seg { display: inline-flex; background: var(--surface); border: 1px solid var(--ring); border-radius: 8px; padding: 2px; }
  .seg button { background: none; border: 0; border-radius: 6px; padding: 5px 12px; cursor: pointer; color: var(--ink-2); }
  .seg button[aria-pressed="true"] { background: var(--wash); color: var(--ink); font-weight: 600; }

  .problem { background: var(--surface); border: 1px solid var(--ring); border-left: 3px solid var(--critical); border-radius: 8px; padding: 14px 16px; margin-bottom: 20px; }
  .problem b { display: block; margin-bottom: 4px; }
  .problem code { background: var(--wash); padding: 1px 4px; border-radius: 4px; }

  .tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
  .tile { background: var(--surface); border: 1px solid var(--ring); border-radius: 10px; padding: 14px 16px; }
  .tile .k { color: var(--ink-2); font-size: 12px; }
  .tile .v { font-size: 26px; font-weight: 600; margin-top: 2px; }
  .tile .s { color: var(--muted); font-size: 12px; }

  .card { background: var(--surface); border: 1px solid var(--ring); border-radius: 10px; padding: 16px 18px 18px; margin-bottom: 16px; }
  .card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
  .card h2 { font-size: 15px; font-weight: 600; margin: 0; }
  .card .sub { color: var(--ink-2); font-size: 12.5px; margin: 2px 0 0; }
  .grid2 { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 16px; align-items: start; }
  .empty { color: var(--muted); padding: 24px 0; text-align: center; }

  svg text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  svg .lbl { fill: var(--ink); font-size: 12.5px; font-variant-numeric: normal; }
  svg .val { fill: var(--ink-2); font-size: 11.5px; }
  svg .grid { stroke: var(--grid); stroke-width: 1; shape-rendering: crispEdges; }
  svg .base { stroke: var(--axis); stroke-width: 1; shape-rendering: crispEdges; }
  svg .hit { fill: transparent; cursor: default; }
  svg .hit:hover + .mark, svg .hit:focus + .mark { opacity: .75; }
  svg .hit:focus { outline: none; }
  svg .hit:focus-visible { stroke: var(--s1); stroke-width: 2; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-weight: 600; color: var(--ink-2); font-size: 12px; padding: 6px 8px; border-bottom: 1px solid var(--axis); white-space: nowrap; }
  td { padding: 7px 8px; border-bottom: 1px solid var(--grid); vertical-align: middle; }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
  td .small { color: var(--muted); font-size: 12px; }
  .legend { display: flex; gap: 16px; font-size: 12px; color: var(--ink-2); margin: 0 0 8px; }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; background: var(--c); }
  .segbar { display: flex; gap: 2px; height: 8px; width: 100%; min-width: 120px; }
  .segbar i { display: block; height: 100%; border-radius: 4px; background: var(--c); }
  .segbar.none { background: var(--grid); border-radius: 4px; }

  #tip { position: fixed; pointer-events: none; background: var(--surface); border: 1px solid var(--ring); border-radius: 8px;
         box-shadow: 0 4px 16px rgba(0,0,0,.12); padding: 8px 10px; font-size: 12.5px; min-width: 140px; display: none; z-index: 10; }
  #tip .t { color: var(--ink-2); margin-bottom: 4px; }
  #tip .r { display: flex; justify-content: space-between; gap: 14px; }
  #tip .r b { font-variant-numeric: tabular-nums; }
  /* Status colours (fixed in both modes); always paired with an icon and a label. */
  :root { --good: #0ca30c; --warning: #fab219; --serious: #ec835a; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--grid); margin-top: 14px; }
  .tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 14px; margin-bottom: -1px; color: var(--ink-2); font-weight: 600; cursor: pointer; }
  .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--s1); }
  .sess-grid { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 16px; align-items: start; }
  .devlist { display: flex; flex-direction: column; gap: 6px; }
  .dev { display: block; width: 100%; text-align: left; background: none; border: 1px solid var(--ring); border-radius: 8px; padding: 10px 12px; cursor: pointer; }
  .dev:hover { background: var(--wash); }
  .dev[aria-current="true"] { border-color: var(--s1); background: var(--wash); }
  .dev .nm { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 600; }
  .dev .meta { color: var(--ink-2); font-size: 12px; margin-top: 2px; }
  .dev .ren { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 12px; padding: 2px 4px; border-radius: 4px; }
  .dev .ren:hover { color: var(--ink); background: var(--wash); }
  .dev input { font: inherit; font-weight: 600; width: 100%; border: 1px solid var(--s1); border-radius: 6px; padding: 2px 6px; background: var(--surface); color: var(--ink); }
  .scroll { max-height: 340px; overflow: auto; }
  tr.pick { cursor: pointer; }
  tr.pick:hover td { background: var(--wash); }
  tr.sel td { background: var(--wash); }
  tr.sel td:first-child { box-shadow: inset 3px 0 var(--s1); }
  tr.future td { opacity: .3; }
  tr.now td { background: var(--wash); }
  .chip { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .chip b { color: var(--c); font-size: 13px; width: 14px; text-align: center; }
  .controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 4px 0 10px; }
  .clock { font-variant-numeric: tabular-nums; color: var(--ink-2); font-size: 13px; }
  .legend .sym::before { display: none; }
  .legend .sym b { color: var(--c); margin-right: 5px; }
  svg .idle { fill: var(--wash); }
  svg .cursor { stroke: var(--ink); stroke-width: 1.5; }
  @media (max-width: 900px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid2, .sess-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main id="main">
  <header>
    <h1>Wordopedia usage</h1>
    <div><span class="fresh" id="fresh"></span> <button class="btn" id="refresh">Refresh</button></div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Views">
    <button role="tab" id="t-overview" data-tab="overview" aria-controls="tab-overview">Overview</button>
    <button role="tab" id="t-sessions" data-tab="sessions" aria-controls="tab-sessions">Sessions</button>
  </nav>

  <div class="filters" role="group" aria-label="Filters">
    <label>Period
      <span class="seg" id="days">
        <button data-v="7">7 days</button><button data-v="30">30 days</button><button data-v="90">90 days</button><button data-v="0">All</button>
      </span>
    </label>
    <label>Course <select id="course"><option value="">All courses</option></select></label>
    <label>Exercise <select id="ex"><option value="">All exercises</option></select></label>
    <label id="min-wrap">Words: min. first answers
      <select id="min"><option>1</option><option selected>3</option><option>5</option><option>10</option><option>20</option></select>
    </label>
  </div>

  <div id="problem"></div>

  <div id="tab-overview" role="tabpanel" aria-labelledby="t-overview">
    <section class="tiles" id="tiles" aria-label="Summary"></section>
    <section class="card" id="c-daily"></section>
    <section class="card" id="c-ex"></section>
    <div class="grid2">
      <section class="card" id="c-words"></section>
      <section class="card" id="c-conf"></section>
    </div>
    <section class="card" id="c-match"></section>
    <div class="grid2">
      <section class="card" id="c-awards"></section>
      <section class="card" id="c-sections"></section>
    </div>
  </div>

  <div id="tab-sessions" role="tabpanel" aria-labelledby="t-sessions" hidden>
    <div class="sess-grid">
      <section class="card" id="c-devices"></section>
      <div>
        <section class="card" id="c-sessions"></section>
        <section class="card" id="c-replay"></section>
      </div>
    </div>
  </div>
</main>
<div id="tip" role="status" aria-live="polite"></div>

<script>
'use strict';
// ----- names -----
const COURSES = { de: 'German', fr: 'French', 'en-elementary': 'Elementary English', 'en-basic': 'Basic English', math: 'Maths' };
const EXERCISES = { 'x-bg': 'Translation into Bulgarian', 'bg-x': 'Translation from Bulgarian', art: 'Articles', conj: 'Conjugation', 'conj-table': 'Conjugation table', match: 'Matching', dialog: 'Dialogues', math: 'Multiplication' };
const FORMATS = { test: 'test', open: 'free answer', table: 'table', order: 'ordering' };
const courseName = c => COURSES[c] || c || 'No course';
const exName = e => EXERCISES[e] || e;
// Short form beside a value, so the same word in two exercises can be told apart.
const EX_SHORT = { 'x-bg': 'into BG', 'bg-x': 'from BG', art: 'articles', conj: 'conjugation', match: 'matching', dialog: 'dialogue', math: '' };
const exShort = (e, fmt) => [EX_SHORT[e] ?? e, fmt === 'open' ? 'typed' : ''].filter(Boolean).join(', ');
// Word ids: "<course>:<set>|<article word>", "<course>:conj:<verb>:<person>", "math:mul:<a>x<b>".
function wordParts(id) {
  let m = /^math:mul:(\d+)x(\d+)$/.exec(id);
  if (m) return { main: `${m[1]} × ${m[2]}`, sub: 'multiplication' };
  m = /^[^:]+:conj:([^:]+):(.+)$/.exec(id);
  if (m) return { main: `${m[1]} · ${m[2]}`, sub: 'conjugation' };
  m = /^[^:]+:dlg:(.+)$/.exec(id);
  if (m) return { main: m[1], sub: 'dialogue' };
  const i = id.indexOf('|'), j = id.indexOf(':');
  return i > 0 ? { main: id.slice(i + 1), sub: id.slice(j + 1, i) } : { main: id, sub: '' };
}

// ----- formatting -----
const nf = new Intl.NumberFormat('en-GB');
const pct = (a, b) => (b ? Math.round((100 * a) / b) + '%' : '–');
function dur(secs) {
  secs = Math.round(secs || 0);
  if (secs < 60) return secs + ' s';
  const m = Math.round(secs / 60);
  return m < 60 ? m + ' min' : `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, '0')} min`;
}
function ago(ms) {
  if (!ms) return 'no events yet';
  const s = (Date.now() - ms) / 1000;
  if (s < 90) return 'last event just now';
  if (s < 5400) return `last event ${Math.round(s / 60)} min ago`;
  if (s < 172800) return `last event ${Math.round(s / 3600)} h ago`;
  return `last event ${Math.round(s / 86400)} days ago`;
}
const dayLabel = d => new Date(d + 'T12:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });

// ----- DOM helpers (all data goes in as text, never as HTML) -----
const $ = s => document.querySelector(s);
function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) { if (k === 'style') e.style.cssText = v; else if (k.startsWith('on')) e[k] = v; else e.setAttribute(k, v); }
  for (const k of kids.flat()) if (k !== null && k !== undefined && k !== false) e.append(k instanceof Node ? k : document.createTextNode(String(k)));
  return e;
}
const SVGNS = 'http://www.w3.org/2000/svg';
function sv(tag, attrs, text) {
  const e = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v);
  if (text !== undefined) e.textContent = text;
  return e;
}

// ----- tooltip -----
const tip = $('#tip');
function showTip(evt, title, rows) {
  tip.replaceChildren(el('div', { class: 't' }, title), ...rows.map(([k, v]) => el('div', { class: 'r' }, el('span', {}, k), el('b', {}, v))));
  tip.style.display = 'block';
  let x, y;
  if (evt.clientX !== undefined && evt.type !== 'focus') { x = evt.clientX + 14; y = evt.clientY + 14; }
  else { const r = evt.target.getBoundingClientRect(); x = r.right + 8; y = r.top; }
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(x, innerWidth - w - 8) + 'px';
  tip.style.top = Math.min(y, innerHeight - h - 8) + 'px';
}
const hideTip = () => { tip.style.display = 'none'; };
function hover(target, title, rows, label) {
  target.setAttribute('tabindex', '0');
  target.setAttribute('aria-label', label);
  const on = e => showTip(e, title, rows);
  target.addEventListener('pointermove', on); target.addEventListener('focus', on);
  target.addEventListener('pointerleave', hideTip); target.addEventListener('blur', hideTip);
}

// ----- card with a chart / table switch -----
function card(id, title, sub, chart, table, emptyText) {
  const c = $(id);
  if (!chart) { c.replaceChildren(el('div', { class: 'card-head' }, el('div', {}, el('h2', {}, title), sub && el('p', { class: 'sub' }, sub))), el('div', { class: 'empty' }, emptyText)); return; }
  const body = el('div', {});
  let asTable = c.dataset.table === '1';
  const btn = el('button', { class: 'btn', 'aria-pressed': String(asTable) }, asTable ? 'Chart' : 'Table');
  const paint = () => { body.replaceChildren(asTable ? table() : chart()); btn.textContent = asTable ? 'Chart' : 'Table'; btn.setAttribute('aria-pressed', String(asTable)); };
  btn.onclick = () => { asTable = !asTable; c.dataset.table = asTable ? '1' : ''; paint(); };
  c.replaceChildren(el('div', { class: 'card-head' }, el('div', {}, el('h2', {}, title), sub && el('p', { class: 'sub' }, sub)), table ? btn : ''), body);
  paint();
}
function tableOf(head, rows, numeric) {
  return el('table', {}, el('thead', {}, el('tr', {}, head.map((h, i) => el('th', { class: numeric.includes(i) ? 'n' : '' }, h)))),
    el('tbody', {}, rows.map(r => el('tr', {}, r.map((v, i) => el('td', { class: numeric.includes(i) ? 'n' : '' }, v))))));
}

// ----- scales -----
// Axis for counts: whole-number steps of 1, 2, 5, 10, 20, 50 …, the smallest that covers v in at most five steps.
function niceScale(v) {
  for (let p = 1; ; p *= 10) for (const m of [1, 2, 5]) {
    const step = m * p, n = Math.max(1, Math.ceil(v / step));
    if (n <= 5) return { max: step * n, step };
  }
}
// Column / bar with 4px rounded data end, square at the baseline.
function colPath(x, y, w, h) {
  const r = Math.min(4, w / 2, h);
  return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
}
function barPath(x, y, w, h) {
  const r = Math.min(4, h / 2, w);
  return `M${x},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h - r}Q${x + w},${y + h} ${x + w - r},${y + h}H${x}Z`;
}

// ----- sections -----
function renderTiles(t) {
  const items = [
    ['Learners', nf.format(t.learners || 0), 'devices with a session'],
    ['Sessions', nf.format(t.sessions || 0), 'exercises started'],
    ['Active time', dur(t.active_secs), 'screen on, in exercises'],
    ['Finished', pct(t.finished, t.ended), `${nf.format(t.finished || 0)} of ${nf.format(t.ended || 0)} ended sessions`],
    ['Right first time', pct(t.first_right, t.first_answers), `${nf.format(t.first_answers || 0)} first answers`],
  ];
  $('#tiles').replaceChildren(...items.map(([k, v, s]) => el('div', { class: 'tile' }, el('div', { class: 'k' }, k), el('div', { class: 'v' }, v), el('div', { class: 's' }, s))));
}

// Local calendar day (this browser's time zone, summer time included).
const localDay = ms => { const d = new Date(ms); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
function renderDaily(rows, f) {
  // Hours per device -> local days: sessions, distinct learners, active time.
  const byDay = new Map();
  for (const r of rows) {
    const day = localDay(r.hour * 3600e3);
    const d = byDay.get(day) || { day, sessions: 0, devs: new Set(), active_secs: 0 };
    d.sessions += r.sessions; d.active_secs += r.active_secs; if (r.sessions > 0) d.devs.add(r.dev);
    byDay.set(day, d);
  }
  // Every day of the period, from the day the period starts, so a day without sessions shows as a gap.
  const days = [], today = localDay(Date.now());
  const first = f.since ? localDay(f.since) : [...byDay.keys()].sort()[0];
  if (first) for (let d = new Date(first + 'T12:00:00'); localDay(+d) <= today; d.setDate(d.getDate() + 1)) days.push(localDay(+d));
  const data = days.map(d => { const x = byDay.get(d); return x ? { day: d, sessions: x.sessions, learners: x.devs.size, active_secs: x.active_secs } : { day: d, sessions: 0, learners: 0, active_secs: 0 }; });
  const has = data.some(r => r.sessions > 0);
  card('#c-daily', 'Sessions per day', 'Exercises started each day; hover for learners and active time.', has && (() => {
    const W = 1120, H = 220, L = 34, R = 8, T = 10, B = 26, pw = W - L - R, ph = H - T - B;
    const { max, step } = niceScale(Math.max(...data.map(d => d.sessions)));
    const s = sv('svg', { viewBox: `0 0 ${W} ${H}`, width: '100%', role: 'img', 'aria-label': 'Sessions per day' });
    for (let i = 0; i <= max / step; i++) {
      const v = step * i, y = T + ph - (v / max) * ph;
      s.append(sv('line', { class: i ? 'grid' : 'base', x1: L, x2: W - R, y1: y, y2: y }));
      s.append(sv('text', { x: L - 6, y: y + 4, 'text-anchor': 'end' }, nf.format(v)));
    }
    const band = pw / data.length, bw = Math.max(2, Math.min(24, band - 2));
    const every = Math.ceil(data.length / 12);
    data.forEach((d, i) => {
      const x = L + i * band + (band - bw) / 2, h = (d.sessions / max) * ph;
      const hit = sv('rect', { class: 'hit', x: L + i * band, y: T, width: band, height: ph });
      hover(hit, dayLabel(d.day), [['Sessions', nf.format(d.sessions)], ['Learners', nf.format(d.learners)], ['Active time', dur(d.active_secs)]],
        `${dayLabel(d.day)}: ${d.sessions} sessions`);
      s.append(hit);
      s.append(h > 0 ? sv('path', { class: 'mark', d: colPath(x, T + ph - h, bw, h), fill: 'var(--s1)' }) : sv('g', { class: 'mark' }));
      if (i % every === 0) s.append(sv('text', { x: L + i * band + band / 2, y: H - 8, 'text-anchor': 'middle' }, dayLabel(d.day)));
    });
    return s;
  }), () => tableOf(['Day', 'Sessions', 'Learners', 'Active time'], data.filter(d => d.sessions || d.active_secs).map(d => [dayLabel(d.day), nf.format(d.sessions), nf.format(d.learners), dur(d.active_secs)]), [1, 2, 3]),
  'No sessions in this period.');
}

const OUTCOMES = [['finished', 'Finished', 'var(--s1)'], ['quit', 'Quit', 'var(--s2)'], ['abandoned', 'App closed', 'var(--s3)']];
function renderExercises(rows) {
  const name = r => [exName(r.ex), FORMATS[r.fmt] || r.fmt];
  const head = ['Exercise', 'Sessions', 'How sessions ended', 'Dropped in first 3 answers', 'Avg. active time', 'Help used', 'Idle minutes'];
  const cells = r => {
    const ended = r.finished + r.quit + r.abandoned;
    const bar = ended ? el('div', { class: 'segbar', role: 'img', 'aria-label': OUTCOMES.map(([k, n]) => `${n} ${r[k]}`).join(', ') },
      OUTCOMES.filter(([k]) => r[k] > 0).map(([k, n, c]) => el('i', { style: `--c:${c};flex:${r[k]} 1 0` })))
      : el('div', { class: 'segbar none', 'aria-label': 'no ended sessions' });

  const my = ++rseq;
  if (!state.sess) { renderReplay({ events: [] }); return; }
  try { const j = await api('/api/session', { id: state.sess }); if (my === rseq) { $('#problem').replaceChildren(); renderReplay(j); } }
  catch (e) { if (my === rseq) showProblem(e); }
}
async function loadSessionsTab(my) {
  const j = await api('/api/devices', state);
  if (my !== seq) return;
  $('#problem').replaceChildren();
  syncControls(j.meta);
  $('#fresh').textContent = `${j.source === 'local' ? 'Local database' : 'Cloudflare D1'} · ${nf.format(j.freshness.events || 0)} events · ${ago(j.freshness.last_rx)}`;
  if (!j.devices.some(d => d.dev === state.dev)) { state.dev = j.devices.length ? j.devices[0].dev : ''; state.sess = ''; save(); }
  renderDevices(j.devices);
  await loadSessions();
}

// ----- tabs, filters and loading -----
const state = { days: '30', course: '', ex: '', min: '3', tab: 'overview', dev: '', sess: '' };
try { Object.assign(state, JSON.parse(localStorage.getItem('wordopedia.dashboard') || '{}')); } catch (e) {}
const save = () => { try { localStorage.setItem('wordopedia.dashboard', JSON.stringify(state)); } catch (e) {} };

function fillSelect(sel, values, names, value, allText) {
  const opts = [el('option', { value: '' }, allText), ...values.map(v => el('option', { value: v }, names(v)))];
  sel.replaceChildren(...opts);
  sel.value = values.includes(value) ? value : '';
}
function syncControls(meta) {
  document.querySelectorAll('#days button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === state.days)));
  const courses = [...new Set(meta.map(m => m.course).filter(Boolean))];
  if (state.course && !courses.includes(state.course)) courses.push(state.course);
  fillSelect($('#course'), courses, courseName, state.course, 'All courses');
  const exs = [...new Set(meta.filter(m => !state.course || m.course === state.course).map(m => m.ex))];
  if (state.ex && !exs.includes(state.ex)) exs.push(state.ex);
  fillSelect($('#ex'), exs, exName, state.ex, 'All exercises');
  $('#min').value = state.min;
}

let seq = 0;
function showTab() {
  for (const t of ['overview', 'sessions']) {
    $('#t-' + t).setAttribute('aria-selected', String(state.tab === t));
    $('#t-' + t).tabIndex = state.tab === t ? 0 : -1;
    $('#tab-' + t).hidden = state.tab !== t;
  }
  $('#min-wrap').hidden = state.tab !== 'overview'; // only the word ranking uses it
}
async function load() {
  const my = ++seq;
  sseq++; rseq++; // session lists and replays still loading were asked for with the previous filters
  $('#main').classList.add('loading');
  showTab();
  try {
    if (state.tab === 'sessions') { await loadSessionsTab(my); return; }
    const j = await api('/api/report', { min: state.min, days: state.days, course: state.course, ex: state.ex });
    if (my !== seq) return;
    $('#problem').replaceChildren();
    syncControls(j.meta);
    $('#fresh').textContent = `${j.source === 'local' ? 'Local database' : 'Cloudflare D1'} · ${nf.format(j.freshness.events || 0)} events · ${ago(j.freshness.last_rx)}`;
    renderTiles(j.tiles); renderDaily(j.hourly, j.filter); renderExercises(j.exercises); renderWords(j.words, j.filter); renderConfusions(j.confusions);
    renderMatch(j.match || []); renderAwards(j.awards || []); renderSections(j.sections || []);
  } catch (e) {
    if (my !== seq) return;
    showProblem(e);
  } finally { if (my === seq) $('#main').classList.remove('loading'); }
}

document.querySelectorAll('#days button').forEach(b => { b.onclick = () => { state.days = b.dataset.v; save(); load(); }; });
$('#course').onchange = e => { state.course = e.target.value; state.ex = ''; save(); load(); };
$('#ex').onchange = e => { state.ex = e.target.value; save(); load(); };
$('#min').onchange = e => { state.min = e.target.value; save(); load(); };
$('#refresh').onclick = load;
document.querySelectorAll('.tabs button').forEach(b => {
  b.onclick = () => { if (state.tab !== b.dataset.tab) { state.tab = b.dataset.tab; save(); load(); } };
  b.onkeydown = e => { if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { const o = document.querySelector(`.tabs button:not([data-tab="${b.dataset.tab}"])`); o.focus(); o.click(); } };
});
document.querySelectorAll('#days button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === state.days)));
load();
</script>
</body>
</html>
