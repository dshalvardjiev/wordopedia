<!DOCTYPE html>
<!-- Start page at the root address. It is not an app instance: each instance lives in its own folder. -->
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
  <title>Wordopedia</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #F2F5FA; color: #1B2333;
      font: 17px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 420px; padding: 24px; text-align: center; }
    h1 { font-size: 28px; margin: 0 0 8px; }
    p { margin: 0 0 12px; color: #4A5468; }
    a { display: inline-block; margin-top: 8px; padding: 12px 20px; border-radius: 999px; background: #2747D0; color: #fff;
      text-decoration: none; font-weight: 700; }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <main>
    <h1>Wordopedia</h1>
    <p>Отвори приложението от линка, който си получил.</p>
    <div id="moved" hidden>
      <p>На този адрес преди имаше приложение. То е преместено и напредъкът ти е запазен.</p>
      <a href="./production/">Продължи</a>
    </div>
  </main>
  <script>
    // Learners of the former root app (data under "woerter.v1") get a link to where it moved.
    try { if (localStorage.getItem('woerter.v1')) document.getElementById('moved').hidden = false; } catch (e) {}
  </script>
</body>
</html>
